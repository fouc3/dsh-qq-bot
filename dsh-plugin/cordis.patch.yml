# DSH-QQ-Bot 插件层：把 QQ 侧网关接到本机 dsh 会话上。
#
# 安装（会自动写 profile 的 package.json 与 cordis.patch.yml，不要手工改）：
#   plugin_manager action=install_bundle target=/home/fouc3/Projects/DSH-QQ-Bot/dsh-plugin
# 或：
#   dsh plugin --profile web add /home/fouc3/Projects/DSH-QQ-Bot/dsh-plugin
#
# 下面这一行的 config 就是插件侧的唯一配置来源（改完重启 dsh web 生效）。
- insert:
    - id: dsh-qq-bot
      name: '@local/dsh-qq-bot'
      config:
        # 本地通道 socket；必须与 Go 侧 config.yaml 的 bridge.socket 完全一致。
        # 目录会被建成 0700、socket 文件 0600：权限即认证，仅当前账户可访问。
        socketPath: '~/.dsh/dsh-qq-bot/bridge.sock'
        # 可选加固：非空时 Go 侧连接后必须先发 {"token":"…"} 握手帧。
        token: ''
        # 绑定关系、待发消息、白名单快照等状态（原子写，0600）。
        stateFile: '~/.dsh/dsh-qq-bot/state.json'

        # AI 每条回复开头的来源标注（善用 md 排版）。
        replyHeader: true
        replyHeaderTemplate: '【{title}({id})】'
        # 每轮结束通知。
        noticeTemplate: '{title}({id})已结束'
        # 会话标识显示形态：full=完整 session id，short=去掉 session- 前缀。
        idStyle: 'full'

        # qq_reply 的 markdown 开关默认值（AI 可在调用时覆盖）。
        defaultMarkdown: true

        # 提问桥：QQ 侧等待用户作答的时限（dsh 默认 legacy 模式没有超时，
        # 这里是该提问在 QQ 侧的唯一时间界）；超时后交回 dsh GUI 回答。
        questionTimeoutMs: 600000
        # 单张提问卡片的按钮上限（平台硬限是 5 行 × 每行 5 个，这里按每行 4 个排版，
        # 故 20 = 5 行 × 4 个）；一次提问放不下一张卡就**拆成多张卡片**，
        # 只有单道题自己就放不下时才降级到 dsh GUI 回答（并在 QQ 侧说明）。
        maxQuestionButtons: 20

        # 等待 Go 侧 ack 的时限（超过就认为"尚未确认送达"，由工具结果如实告知 AI）。
        replyAckTimeoutMs: 8000
        # 结束通知的兜底：turn/end 没到也在此毫秒数后补发一次（按 会话+轮次 去重）。
        noticeFallbackMs: 3000
        # 会话选择卡片每页最多列几个会话。
        sessionPageSize: 8

        # dsh 内置命令收进 QQ 菜单的二级菜单时用这个前缀名（多组时自动加序号，
        # 如「dsh 命令1」「dsh 命令2」）；顶层 ≤10 项、二级 ≤5 项是平台硬限制。
        dshMenuLabel: 'dsh 命令'

        # 点「我需要回复」时注入会话的消息。
        needReplyText: '用户点了「我需要回复」。请把上一条消息对应的结果完整地回复给用户。'
        # 点击后回给用户的确认（互动回应 code=0 之外，再发一条明确的文字）。
        needReplyAckText: '已触发，正在请求回复…'
